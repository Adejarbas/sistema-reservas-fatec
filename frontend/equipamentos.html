<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipamentos - Reservas Fatec</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="equipamentos">
  <main class="conteudo" id="conteudo" tabindex="-1">
    <h1>Equipamentos</h1>
    <div id="mensagem" hidden tabindex="-1"></div>

    <form id="form-equipamento" class="card" novalidate>
      <h2 id="titulo-form">Novo equipamento</h2>
      <input type="hidden" name="editando_id">
      <div class="grade-form">
        <div class="campo">
          <label for="codigo_patrimonio">Patrimônio / código interno</label>
          <input type="text" id="codigo_patrimonio" name="codigo_patrimonio" required>
        </div>
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" required>
        </div>
        <div class="campo">
          <label for="categoria_id">Categoria</label>
          <select id="categoria_id" name="categoria_id" required></select>
        </div>
        <div class="campo">
          <label for="localizacao">Local de armazenamento</label>
          <input type="text" id="localizacao" name="localizacao">
        </div>
        <div class="campo">
          <label for="tipo_controle">Controle</label>
          <select id="tipo_controle" name="tipo_controle">
            <option value="individual">Individual (item com patrimônio)</option>
            <option value="quantidade">Por quantidade (ex.: cabos)</option>
          </select>
        </div>
        <div class="campo">
          <label for="quantidade_total">Quantidade em estoque</label>
          <input type="number" id="quantidade_total" name="quantidade_total" min="1" value="1" disabled>
        </div>
      </div>
      <div class="acoes">
        <button type="submit" class="botao">Salvar</button>
        <button type="button" class="botao botao-secundario" id="botao-cancelar" hidden>Cancelar edição</button>
      </div>
    </form>

    <form id="form-filtro" class="card filtros">
      <div class="campo">
        <label for="filtro-categoria">Categoria</label>
        <select id="filtro-categoria" name="categoria_id"></select>
      </div>
      <div class="campo">
        <label for="filtro-situacao">Situação</label>
        <select id="filtro-situacao" name="situacao"></select>
      </div>
      <div class="campo">
        <label for="busca">Buscar</label>
        <input type="search" id="busca" name="busca" placeholder="Nome ou patrimônio">
      </div>
      <div class="campo">
        <button type="submit" class="botao">Filtrar</button>
      </div>
    </form>

    <div class="tabela-container">
      <table class="tabela-responsiva">
        <caption class="visualmente-oculto">Equipamentos cadastrados</caption>
        <thead>
          <tr>
            <th scope="col">Patrimônio</th>
            <th scope="col">Nome</th>
            <th scope="col">Categoria</th>
            <th scope="col">Qtd.</th>
            <th scope="col">Situação</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>

    <section class="card" style="margin-top: 1.5rem">
      <h2>Categorias</h2>
      <form id="form-categoria" class="filtros" novalidate>
        <div class="campo">
          <label for="nome-categoria">Nova categoria</label>
          <input type="text" id="nome-categoria" name="nome">
        </div>
        <div class="campo">
          <button type="submit" class="botao botao-secundario">Adicionar</button>
        </div>
      </form>
      <ul id="lista-categorias"></ul>
    </section>
  </main>

  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/equipamentos.js"></script>
</body>
</html>
