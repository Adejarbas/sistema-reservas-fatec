<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Reservas Fatec</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="pagina-login">
    <div class="caixa-login">
      <h1>Reservas <span style="color: var(--vermelho)">Fatec</span></h1>
      <p class="subtitulo" style="text-align: center; margin-top: 0">Atividades extracurriculares, espaços e equipamentos</p>

      <div id="mensagem" hidden></div>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        </div>
        <button type="submit" class="botao">Entrar</button>
      </form>

      <p class="rodape-login"><a href="agenda-publica.html">Ver agenda de eventos</a></p>
    </div>
  </main>

  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
